# Inside the existing `server { listen 443 ssl; server_name YOUR_DOMAIN; ... }` block.
# The site then calls https://YOUR_DOMAIN/gm-ai  (put exactly this into growthMap.endpoint).
location /gm-ai/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 40s;
    client_max_body_size 64k;
}
