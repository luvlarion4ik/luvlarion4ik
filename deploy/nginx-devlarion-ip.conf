# Прямой доступ к сайтам по IP сервера, без DNS:
#   :80   классический сайт, :8081 motion, :8082 «Сборка», :8083 North Max.
# Ссылки на домены в HTML, CSS и JS подменяются на адреса по IP,
# чтобы стили и переходы между сайтами работали до появления DNS.


server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8081;
    listen 8082;
    listen 8083;
    server_name _;

    set $site classic;
    if ($server_port = 8081) { set $site motion; }
    if ($server_port = 8082) { set $site studio; }
    if ($server_port = 8083) { set $site north; }
    root /var/www/devlarion/$site;
    index index.html;

    sub_filter_once off;
    sub_filter_types text/css application/javascript text/javascript application/xml text/plain;
    sub_filter "https://devlarion.ru/" "http://13.143.207.212/";
    sub_filter "https://motion.devlarion.ru/" "http://13.143.207.212:8081/";
    sub_filter "https://studio.devlarion.ru/" "http://13.143.207.212:8082/";
    sub_filter "https://north.devlarion.ru/" "http://13.143.207.212:8083/";

    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ @spa;
    }
    location @spa {
        if ($site = studio) { rewrite ^ /index.html last; }
        if ($site = north) { rewrite ^ /index.html last; }
        return 404;
    }
}
