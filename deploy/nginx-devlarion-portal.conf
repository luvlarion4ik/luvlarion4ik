# Личный кабинет: https://devlarion.ru/account/ (клиенты), /account/admin/ (вы, по паролю).
location = /account { return 301 /account/; }
location ^~ /account/admin/ {
    auth_basic "Devlarion admin";
    auth_basic_user_file /etc/nginx/devlarion-admin.htpasswd;
    limit_req zone=devlarion_admin burst=20 nodelay;
    proxy_pass http://127.0.0.1:4176/;
    client_max_body_size 45m;
}
location ^~ /account/ {
    limit_req zone=devlarion_admin burst=30 nodelay;
    proxy_pass http://127.0.0.1:4175/;
    client_max_body_size 1m;
}
