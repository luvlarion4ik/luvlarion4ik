# HTML всегда перепроверяется у сервера, чтобы после выкладки браузер сразу брал новые CSS и JS
# (их адреса содержат ?v=хеш, поэтому сами ресурсы можно кэшировать надолго).
map $sent_http_content_type $devlarion_cache_control {
    ~*text/html "no-cache";
    default     "";
}
add_header Cache-Control $devlarion_cache_control;
