# Админка Devlarion: https://devlarion.ru/admin/ (подключается include-ом в server devlarion.ru).
# Вход по паролю из /etc/nginx/devlarion-admin.htpasswd, частота попыток ограничена
# (зона devlarion_admin объявлена в /etc/nginx/conf.d/devlarion-admin-limit.conf).
location = /admin { return 301 /admin/; }
location /admin/ {
    auth_basic "Devlarion admin";
    auth_basic_user_file /etc/nginx/devlarion-admin.htpasswd;
    limit_req zone=devlarion_admin burst=20 nodelay;
    proxy_pass http://127.0.0.1:4174/;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
