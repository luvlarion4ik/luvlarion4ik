# nginx: четыре сайта Devlarion на одном сервере.
# devlarion.ru / www → классический сайт, motion. → motion-версия,
# studio. → конструктор «Сборка», north. → мобильное демо North Max.
# HTTPS добавляет certbot (--nginx) после того, как DNS укажет на сервер.

server {
    listen 80;
    listen [::]:80;
    server_name www.devlarion.ru;
    return 301 $scheme://devlarion.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name devlarion.ru;
    root /var/www/devlarion/classic;
    index index.html;
    error_page 404 /404.html;
    location /ru/ { error_page 404 /ru/404.html; try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|woff2?|ico)$ { expires 7d; try_files $uri =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name motion.devlarion.ru;
    root /var/www/devlarion/motion;
    index index.html;
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|woff2?|ico)$ { expires 7d; try_files $uri =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name studio.devlarion.ru;
    root /var/www/devlarion/studio;
    index index.html;
    location /assets/ { expires 30d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    listen [::]:80;
    server_name north.devlarion.ru;
    root /var/www/devlarion/north;
    index index.html;
    location /assets/ { expires 30d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
