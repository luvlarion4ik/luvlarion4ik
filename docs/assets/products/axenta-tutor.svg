<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <title>A photographed equation, solved step by step</title>
  <defs>
    <linearGradient id="background" x2="0.95" y2="1">
      <stop stop-color="#161b35"/>
      <stop offset="1" stop-color="#0b1021"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6474e1" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6474e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x2=".75" y2="1">
      <stop stop-color="#f3efff"/>
      <stop offset="1" stop-color="#ccc9eb"/>
    </linearGradient>
    <linearGradient id="panel" x2=".7" y2="1">
      <stop stop-color="#293455"/>
      <stop offset="1" stop-color="#191f3a"/>
    </linearGradient>
    <linearGradient id="answer" x2="1" y2=".8">
      <stop stop-color="#9fa8f6"/>
      <stop offset="1" stop-color="#c3cdf9"/>
    </linearGradient>
    <linearGradient id="signal" gradientUnits="userSpaceOnUse" x1="162" y1="145" x2="291" y2="156">
      <stop stop-color="#a9b5ff"/>
      <stop offset=".7" stop-color="#edb398"/>
      <stop offset="1" stop-color="#fac8aa"/>
    </linearGradient>
    <pattern id="field" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0v20" fill="none" stroke="#b1bafb" stroke-opacity=".13"/>
    </pattern>
    <pattern id="squares" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0v18" fill="none" stroke="#6366a2" stroke-opacity=".23"/>
    </pattern>
  </defs>
  <rect width="480" height="300" fill="url(#background)"/>
  <ellipse cx="232" cy="134" rx="230" ry="155" fill="url(#glow)"/>
  <rect width="480" height="300" fill="url(#field)"/>
  <g fill="none" stroke="#8794d7" stroke-width="1">
    <ellipse cx="233" cy="246" rx="193" ry="23" opacity=".23"/>
    <path d="M24 58v-17h17m398 0h17v17M24 241v17h17m398 0h17v-17" opacity=".54"/>
    <path d="M59 236h60m233 22h63" stroke-dasharray="2 5" opacity=".44"/>
  </g>

  <g transform="rotate(-8 147 148)">
    <rect x="64" y="71" width="178" height="170" rx="12" fill="#090c1d" opacity=".62"/>
    <rect x="57" y="62" width="178" height="170" rx="11" fill="#6f76ad"/>
    <path d="M65 56h141l24 24v141H53V68a12 12 0 0 1 12-12Z" fill="url(#paper)" stroke="#d9d8f4"/>
    <path d="M65 56h141l24 24v141H53V68a12 12 0 0 1 12-12Z" fill="url(#squares)"/>
    <path d="M206 56v24h24" fill="#aeb1dc" stroke="#8c90bb"/>
    <path d="M77 56v165" stroke="#ca829a" stroke-opacity=".72"/>
    <path d="M92 98h46m-46 11h30m-23 68h70m-70 11h41" stroke="#64699f" stroke-linecap="round" stroke-width="2" opacity=".5"/>
    <path d="M90 119h12m-12 0v12m116-12h-12m12 0v12m0 35h-12m12 0v-12m-116 12h12m-12 0v-12"
          fill="none" stroke="#6967c5" stroke-width="2" stroke-linecap="round"/>
    <text x="147" y="150" fill="#25254c" font-family="Georgia, serif" font-size="20" font-weight="bold" font-style="italic" text-anchor="middle">2x + 4 = 10</text>
    <path d="M101 154q44 4 89-4" fill="none" stroke="#b16d8d" stroke-linecap="round" stroke-width="1.6"/>
    <circle cx="65" cy="91" r="3" fill="#646a9c"/>
    <circle cx="65" cy="142" r="3" fill="#646a9c"/>
    <circle cx="65" cy="193" r="3" fill="#646a9c"/>
  </g>

  <path d="M199 155h35c11 0 18-9 28-9h26" fill="none" stroke="#101329" stroke-width="11" stroke-linecap="round"/>
  <path d="M199 155h35c11 0 18-9 28-9h26" fill="none" stroke="url(#signal)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="242" cy="152" r="4" fill="#eeac99" stroke="#24264a" stroke-width="2"/>

  <rect x="269" y="69" width="157" height="170" rx="16" fill="#090d1d" opacity=".65"/>
  <rect x="262" y="62" width="159" height="169" rx="15" fill="url(#panel)" stroke="#929ede" stroke-opacity=".67"/>
  <path d="M277 62h129a15 15 0 0 1 15 15v8H262v-8a15 15 0 0 1 15-15Z" fill="#516096" fill-opacity=".27"/>
  <g fill="#a4b1f2">
    <circle cx="277" cy="74" r="2.4"/>
    <circle cx="284" cy="74" r="2.4" opacity=".55"/>
    <circle cx="291" cy="74" r="2.4" opacity=".3"/>
