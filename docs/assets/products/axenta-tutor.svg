  <path d="M284 107v85" fill="none" stroke="#8899de" stroke-width="1.2" stroke-dasharray="2 4"/>
  <circle cx="284" cy="118" r="3.5" fill="#afbaf7"/>
  <circle cx="284" cy="165" r="4.5" fill="#ebaf98"/>
  <path d="M282 165l1.5 1.6 3-3.4" fill="none" stroke="#25284a" stroke-width="1" stroke-linecap="round"/>
  <rect x="298" y="96" width="107" height="40" rx="8" fill="#141b35" stroke="#6777c1"/>
  <rect x="298" y="146" width="107" height="57" rx="9" fill="url(#answer)"/>
  <text x="351" y="122" fill="#e8ecff" font-family="Georgia, serif" font-size="21" font-style="italic" text-anchor="middle">2x = 6</text>
  <text x="351" y="182" fill="#1d2042" font-family="Georgia, serif" font-size="29" font-weight="bold" font-style="italic" text-anchor="middle">x = 3</text>

  <g fill="#aab5ff">
    <path d="M45 77l2.8 8.2L56 88l-8.2 2.8L45 99l-2.8-8.2L34 88l8.2-2.8Z" opacity=".76"/>
    <path d="M438 188l2.7 7.3 7.3 2.7-7.3 2.7-2.7 7.3-2.7-7.3-7.3-2.7 7.3-2.7Z" opacity=".73"/>
    <circle cx="239" cy="58" r="2" opacity=".66"/>
    <circle cx="234" cy="224" r="2" opacity=".5"/>
  </g>
  <path d="M408 40l1.6 5.4 5.4 1.6-5.4 1.6-1.6 5.4-1.6-5.4-5.4-1.6 5.4-1.6Z" fill="#eeb59e"/>
