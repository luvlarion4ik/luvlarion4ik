<svg xmlns="http://www.w3.org/2000/svg" id="still" width="120" height="96" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Обход матрицы</title>
  <desc id="desc">Светлая точка движется по часовой стрелке. Край матрицы на мгновение светлеет рядом с ней.</desc>
  <style>
    .core { fill: #cecece; }
    .interior, .edge { fill: #797979; }
    .bearing-0 { fill: #eaeaea; --delay: 0s; }
    .bearing-1 { --delay: -2.275s; }
    .bearing-2 { --delay: -1.95s; }
    .bearing-3 { --delay: -1.625s; }
    .bearing-4 { --delay: -1.3s; }
    .bearing-5 { --delay: -.975s; }
    .bearing-6 { --delay: -.65s; }
    .bearing-7 { --delay: -.325s; }
    @media (prefers-reduced-motion: no-preference) {
      .sweep {
        transform-origin: 60px 48px;
        animation: orbit 2.6s linear infinite;
      }
      .edge { animation: catch-light 2.6s ease-in-out var(--delay) infinite; }
      @keyframes orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes catch-light {
        0%, 100% { fill: #eaeaea; }
        6% { fill: #cdcdcd; }
        20%, 92% { fill: #797979; }
      }
    }
    svg:target * { animation: none !important; }
  </style>
  <g class="edge bearing-0">
    <circle cx="53.2" cy="27.6" r="1.95"/>
    <circle cx="60" cy="27.6" r="1.95"/>
    <circle cx="66.8" cy="27.6" r="1.95"/>
  </g>
  <g class="edge bearing-7">
    <circle cx="46.4" cy="34.4" r="1.95"/>
  </g>
  <g class="interior">
    <circle cx="53.2" cy="34.4" r="1.95"/>
