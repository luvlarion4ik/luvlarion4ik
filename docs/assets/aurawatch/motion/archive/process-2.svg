    <circle cx="66.8" cy="34.4" r="1.95"/>
    <circle cx="46.4" cy="41.2" r="1.95"/>
    <circle cx="53.2" cy="41.2" r="1.95"/>
    <circle cx="66.8" cy="41.2" r="1.95"/>
    <circle cx="73.6" cy="41.2" r="1.95"/>
    <circle cx="46.4" cy="48" r="1.95"/>
    <circle cx="73.6" cy="48" r="1.95"/>
    <circle cx="46.4" cy="54.8" r="1.95"/>
    <circle cx="53.2" cy="54.8" r="1.95"/>
    <circle cx="66.8" cy="54.8" r="1.95"/>
    <circle cx="73.6" cy="54.8" r="1.95"/>
    <circle cx="53.2" cy="61.6" r="1.95"/>
    <circle cx="60" cy="61.6" r="1.95"/>
    <circle cx="66.8" cy="61.6" r="1.95"/>
  </g>
  <g class="edge bearing-1">
    <circle cx="73.6" cy="34.4" r="1.95"/>
  </g>
  <g class="edge bearing-6">
    <circle cx="39.6" cy="41.2" r="1.95"/>
    <circle cx="39.6" cy="48" r="1.95"/>
    <circle cx="39.6" cy="54.8" r="1.95"/>
  </g>
  <g class="core">
    <circle cx="60" cy="41.2" r="1.95"/>
    <circle cx="53.2" cy="48" r="1.95"/>
    <circle cx="60" cy="48" r="1.95"/>
    <circle cx="66.8" cy="48" r="1.95"/>
    <circle cx="60" cy="54.8" r="1.95"/>
  </g>
  <g class="edge bearing-2">
    <circle cx="80.4" cy="41.2" r="1.95"/>
    <circle cx="80.4" cy="48" r="1.95"/>
    <circle cx="80.4" cy="54.8" r="1.95"/>
  </g>
  <g class="edge bearing-5">
    <circle cx="46.4" cy="61.6" r="1.95"/>
  </g>
  <g class="edge bearing-3">
    <circle cx="73.6" cy="61.6" r="1.95"/>
  </g>
  <g class="edge bearing-4">
    <circle cx="53.2" cy="68.4" r="1.95"/>
    <circle cx="60" cy="68.4" r="1.95"/>
    <circle cx="66.8" cy="68.4" r="1.95"/>
  </g>
  <circle cx="60" cy="48" r="30" fill="none" stroke="#454545" stroke-width="1.15"/>
  <g class="sweep" fill="none" stroke-linecap="round">
