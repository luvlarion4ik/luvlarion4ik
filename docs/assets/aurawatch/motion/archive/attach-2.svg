<svg xmlns="http://www.w3.org/2000/svg" id="still" width="120" height="96" viewBox="0 0 120 96" role="img" aria-labelledby="title">
  <title id="title">Из файла в превью</title>
  <style>
  svg:target * { animation: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .file { animation: file 3.7s cubic-bezier(.42,0,.30,1) infinite; transform-origin: 60px 48px; }
    @keyframes file { 0%,20%,100% { opacity:1; transform:scale(1.1) } 50%,80% { opacity:0; transform:scale(.86) } }
    .preview { animation: preview 3.7s cubic-bezier(.42,0,.30,1) infinite; transform-origin: 60px 48px; }
    @keyframes preview { 0%,20%,100% { opacity:0; transform:scale(.76) } 50%,80% { opacity:1; transform:scale(1) } }
  }
</style>
  <g class="file" opacity="0">
    <path d="M50 59v-24q0 -2 2 -2h12l7 7v19q0 2 -2 2h-17q-2 0 -2 -2z M64 33v7h7" fill="none" stroke="#bbbbbb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M55 46h11" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M55 50h9" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M55 54h7" fill="none" stroke="#767676" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g class="preview">
