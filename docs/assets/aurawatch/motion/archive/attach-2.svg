    <circle cx="71" cy="40.8" r="2.1" fill="#f5f5f5" />
    <path d="M39 60l12 -11.88l8.5 6.84l5 -4.32l12 9.36" fill="none" stroke="#bbbbbb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
