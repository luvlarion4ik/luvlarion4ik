<svg xmlns="http://www.w3.org/2000/svg" id="still" width="120" height="96" viewBox="0 0 120 96" role="img" aria-labelledby="title">
  <title id="title">Отправка переходит в остановку</title>
  <style>
  svg:target * { animation: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .arrow { animation: arrow 3.5s cubic-bezier(.42,0,.30,1) infinite; }
    @keyframes arrow { 0%,26%,100% { opacity:1; transform:translateY(0) } 42%,82% { opacity:0; transform:translateY(-3px) } }
    .stop { animation: stop 3.5s cubic-bezier(.42,0,.30,1) infinite; transform-origin: 85px 48px; }
    @keyframes stop { 0%,26%,100% { opacity:0; transform:scale(.75) } 45%,82% { opacity:1; transform:scale(1) } }
  }
</style>
  <rect x="20" y="34" width="80" height="28" rx="14" fill="none" stroke="#767676" stroke-width="1.6" />
