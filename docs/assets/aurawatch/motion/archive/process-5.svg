    @keyframes mic { 0%,18%,100% { opacity:1; transform:scale(1) } 49%,78% { opacity:0; transform:scale(.8) } }
    .quote { animation: quote 3.65s cubic-bezier(.42,0,.30,1) infinite; transform-origin: 60px 48px; }
    @keyframes quote { 0%,18%,100% { opacity:0; transform:scale(.88) } 49%,78% { opacity:1; transform:scale(1) } }
  }
</style>
