<svg xmlns="http://www.w3.org/2000/svg" id="still" width="120" height="96" viewBox="0 0 120 96" role="img" aria-labelledby="title">
  <title id="title">Возврат к последнему сообщению</title>
  <style>
  svg:target * { animation: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .history { animation: history 3.6s cubic-bezier(.42,0,.30,1) infinite; }
    @keyframes history { 0%,14%,100% { transform:translateY(4px) } 48%,80% { transform:translateY(-3px) } }
    .jump { animation: jump 3.6s cubic-bezier(.42,0,.30,1) infinite; }
    @keyframes jump { 0%,18%,100% { transform:translateY(5px); opacity:0 } 48%,80% { transform:translateY(0); opacity:1 } }
  }
</style>
  <g class="history">
    <rect x="24" y="20" width="50" height="15" rx="7" fill="none" stroke="#494949" stroke-width="1.5" />
    <path d="M32 27.5h28" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="47" y="39" width="48" height="13" rx="6" fill="#191919" stroke="#767676" stroke-width="1.5" />
    <path d="M55 45.5h27" fill="none" stroke="#bbbbbb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 63h26" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 69h20" fill="none" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g class="jump">
    <circle cx="83" cy="67" r="9" fill="none" stroke="#bbbbbb" stroke-width="1.6" />
    <path d="M83 62.5v8m-3-3 3 3 3-3" fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
